<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">TokenLocal staking lifecycle</title>
  <desc id="desc">A six-step diagram showing funding the pool, approving TKL, staking, earning rewards, claiming rewards, and withdrawing principal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071426"/><stop offset="1" stop-color="#150d30"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#263655" stroke-width="0.55" opacity="0.72"/></pattern>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#67e8f9"/></marker>
    <style>
      .title { font: 700 29px Inter, Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 15px Inter, Arial, sans-serif; fill: #94a3b8; }
      .num { font: 700 14px Inter, Arial, sans-serif; fill: #06121f; }
      .label { font: 700 16px Inter, Arial, sans-serif; fill: #e2e8f0; }
      .small { font: 13px Inter, Arial, sans-serif; fill: #a5b4cf; }
      .note { font: 12px Inter, Arial, sans-serif; fill: #fbbf24; }
    </style>
  </defs>
  <rect width="1200" height="500" rx="24" fill="url(#bg)"/><rect width="1200" height="500" rx="24" fill="url(#grid)" opacity="0.78"/>
  <circle cx="72" cy="65" r="7" fill="#a78bfa" filter="url(#glow)"/><text x="92" y="74" class="title">Staking Lifecycle</text><text x="92" y="100" class="subtitle">Every on-chain write is signed by the wallet; all token quantities are integer TKL base units.</text>

  <path d="M230 264 H300 M410 264 H480 M590 264 H660 M770 264 H840 M950 264 H1020" stroke="url(#flow)" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <g transform="translate(70 192)"><rect width="160" height="145" rx="18" fill="#142a3c" stroke="#22d3ee" stroke-width="2"/><circle cx="30" cy="30" r="17" fill="#67e8f9"/><text x="25" y="35" class="num">1</text><text x="24" y="75" class="label">Fund pool</text><text x="24" y="100" class="small">Owner approves TKL</text><text x="24" y="120" class="small">and deposits rewards</text></g>
  <g transform="translate(300 192)"><rect width="160" height="145" rx="18" fill="#142a3c" stroke="#22d3ee" stroke-width="2"/><circle cx="30" cy="30" r="17" fill="#67e8f9"/><text x="25" y="35" class="num">2</text><text x="24" y="75" class="label">Approve</text><text x="24" y="100" class="small">User authorizes pool</text><text x="24" y="120" class="small">for a stake amount</text></g>
  <g transform="translate(530 192)"><rect width="160" height="145" rx="18" fill="#1d2144" stroke="#a78bfa" stroke-width="2"/><circle cx="30" cy="30" r="17" fill="#c4b5fd"/><text x="25" y="35" class="num">3</text><text x="24" y="75" class="label">Stake</text><text x="24" y="100" class="small">Pool pulls approved</text><text x="24" y="120" class="small">TKL with transferFrom</text></g>
  <g transform="translate(760 192)"><rect width="160" height="145" rx="18" fill="#1d2144" stroke="#a78bfa" stroke-width="2"/><circle cx="30" cy="30" r="17" fill="#c4b5fd"/><text x="25" y="35" class="num">4</text><text x="24" y="75" class="label">Accrue</text><text x="24" y="100" class="small">Reward index grows</text><text x="24" y="120" class="small">with time and stake</text></g>
  <g transform="translate(990 192)"><rect width="160" height="145" rx="18" fill="#261b42" stroke="#f0abfc" stroke-width="2"/><circle cx="30" cy="30" r="17" fill="#f0abfc"/><text x="25" y="35" class="num">5</text><text x="24" y="75" class="label">Claim / exit</text><text x="24" y="100" class="small">Claim reward or</text><text x="24" y="120" class="small">withdraw principal</text></g>

  <rect x="70" y="390" width="1080" height="58" rx="13" fill="#30200f" fill-opacity="0.72" stroke="#fbbf24" stroke-width="1.4"/>
  <text x="96" y="416" class="note">Operational constraint</text>
  <text x="96" y="437" class="small">Principal and rewards share one TKL pool balance in the current contract. Fund rewards before claims and never withdraw pool tokens without reserving user principal and accrued rewards.</text>
</svg>
